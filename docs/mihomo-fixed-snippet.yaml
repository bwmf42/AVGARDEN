# Mihomo 固定 groups/rules 片段（AVGARDEN）
#
# 用途：合并进 NAS mihomo 的 config.yaml（固定主配置）
# 不要写入 Clash_sub_v2.yaml（订阅节点，会更新覆盖）
#
# 位置：/zfs/pool/AppData/mihomo/config.yaml
# 订阅：/zfs/pool/AppData/mihomo/Clash_sub_v2.yaml（仅 proxies）
#
# 合并方式：
# 1. proxy-groups 段：追加「98堂」组（若已存在则跳过）
# 2. rules 段：在 javbus 等站点规则附近插入 kpqq/plwt；勿放在 MATCH 之后
# 3. PUT http://127.0.0.1:9090/configs?force=true 重载
#
# 说明：
# - 98堂 url-test 直测 plwt.kpqq4.com；含日本（有时只是暂时不通，死节点会被测活跳过）
# - 403/Cloudflare 算连通（握手成功）
# - AVGARDEN worker PROXY=http://192.168.5.14:7890 走 mixed-port，由下列规则分流

# ---------------------------------------------------------------------------
# proxy-groups（追加到现有 groups 末尾、rules: 之前）
# ---------------------------------------------------------------------------
  # 98堂专用：自动测活选可用节点（含日本；暂时失败的节点会被跳过）
  # url 直测论坛域名；403/Cloudflare 也算通（TLS 握手成功）
  - name: 98堂
    type: url-test
    include-all: true
    filter: "(?i)美国|香港|新加坡|台湾|台灣|韩国|韓國|日本|GIA"
    url: https://plwt.kpqq4.com/
    expected-status: "200/203/204/301/302/303/307/308/401/403/404/502/503"
    interval: 300
    tolerance: 200
    timeout: 5000
    lazy: false

# ---------------------------------------------------------------------------
# rules（站点相关；完整顺序以线上 config.yaml 为准，下列为 AVGARDEN 相关归档）
# ---------------------------------------------------------------------------
  # 刮削 / 列表源
  - DOMAIN-SUFFIX,javbus.com,Global
  - DOMAIN-SUFFIX,busdmm.ink,Global
  - DOMAIN-SUFFIX,dmmsee.bond,Global
  # 98堂 / plwt（自动选美/港/新/台/韩；勿绑死单节点）
  - DOMAIN-SUFFIX,kpqq4.com,98堂
  - DOMAIN-KEYWORD,plwt,98堂
  - DOMAIN-SUFFIX,nyaa.si,Global
  - DOMAIN-SUFFIX,missav.ai,Global
  - DOMAIN-SUFFIX,missav.ws,Global
  - DOMAIN-SUFFIX,jable.tv,Global
  - DOMAIN-SUFFIX,hohoj.tv,Global
  - DOMAIN-SUFFIX,memojav.com,Global
  - DOMAIN-SUFFIX,kanav.info,Global
  - DOMAIN-SUFFIX,cilisousuo.co,Global
  # DMM/FANZA：日本组
  - DOMAIN-SUFFIX,dmm.co.jp,日本
  - DOMAIN-SUFFIX,dmm.com,日本
  - DOMAIN-SUFFIX,fanza.jp,日本
  - DOMAIN-SUFFIX,special.fanza.jp,日本
  - DOMAIN-SUFFIX,pics.dmm.co.jp,日本
  - DOMAIN-SUFFIX,pics.dmm.com,日本
  - DOMAIN-SUFFIX,awsimgsrc.dmm.com,日本
  # MGS：日本组（NAS 直连常 403）
  - DOMAIN-SUFFIX,mgstage.com,日本
  - DOMAIN-SUFFIX,image.mgstage.com,日本
  - DOMAIN-SUFFIX,static.mgstage.com,日本
