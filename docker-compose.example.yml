services:
  server:
    container_name: av-garden-server
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        # Must match runtime API_KEY so the Vue add-video button can auth.
        VITE_API_KEY: ${API_KEY:-}
    ports:
      - "${AV_GARDEN_HTTP_PORT:-31471}:31471"
    volumes:
      - "${AV_GARDEN_DATA_DIR:?Set AV_GARDEN_DATA_DIR in .env}:/data"
      - "${AV_GARDEN_DB_DIR:-./db}:/db"
      - "${AV_GARDEN_CFG_DIR:-./cfg}:/cfg:ro"
      - "${AV_GARDEN_LOG_DIR:-./logs}:/logs"
    environment:
      SAVE_PATH: /data
      SERVER_PORT: ":31471"
      DB_PATH: /db/downloaded.db
      QUEUE_PATH: /db/download_queue.txt
      QUEUE_API_URL: http://worker:31473
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://host.docker.internal:8080}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Set QBITTORRENT_PASSWORD in .env}
      API_KEY: ${API_KEY:-}
      BLOCKED_ACTRESSES_FILE: /db/blocked_actresses.txt
      BLOCKED_GENRES_FILE: /db/blocked_genres.txt
      FAV_ACTRESSES_FILE: /db/favorite_actresses.txt
      BLOCKED_KEYWORDS_FILE: /db/blocked_keywords.txt
      ACTRESS_AGES_FILE: /db/actress_ages.json
      WEEKLY_WATCHED_FILE: /db/weekly_watched.json
      TZ: ${TZ:-Asia/Shanghai}
      STATUS_DIR: /db/status
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:31471/api/version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - worker
    restart: unless-stopped

  worker:
    container_name: av-garden-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    expose:
      - "31473"
    volumes:
      - "${AV_GARDEN_DATA_DIR:?Set AV_GARDEN_DATA_DIR in .env}:/data"
      - "${AV_GARDEN_DB_DIR:-./db}:/db"
      - "${AV_GARDEN_CFG_DIR:-./cfg}:/app/cfg:ro"
      - "${AV_GARDEN_LOG_DIR:-./logs}:/app/logs"
    environment:
      SAVE_PATH: /data
      DB_PATH: /db/downloaded.db
      QUEUE_PATH: /db/download_queue.txt
      STATE_PATH: /db/queue_state.json
      CURRENT_PATH: /db/current_download.txt
      HISTORY_PATH: /db/download_history.json
      QUEUE_PORT: "31473"
      ONLINE_TTL_SECONDS: "2592000"
      ONLINE_CLEANUP_INTERVAL_SECONDS: "3600"
      WEEKLY_RETENTION_DAYS: "30"
      WEEKLY_RETENTION_ENABLE: "1"
      BLOCKED_ACTRESSES_FILE: /db/blocked_actresses.txt
      BLOCKED_GENRES_FILE: /db/blocked_genres.txt
      FAV_ACTRESSES_FILE: /db/favorite_actresses.txt
      BLOCKED_KEYWORDS_FILE: /db/blocked_keywords.txt
      ACTRESS_AGES_FILE: /db/actress_ages.json
      WEEKLY_WATCHED_FILE: /db/weekly_watched.json
      LOG_DIR: /app/logs
      PROXY: ${PROXY:-}
      QBITTORRENT_URL: ${QBITTORRENT_URL:-http://host.docker.internal:8080}
      QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME:-admin}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD:?Set QBITTORRENT_PASSWORD in .env}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      TRANSLATE_API_BASE: ${TRANSLATE_API_BASE:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-gpt-5.4}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_DAILY_ALERT_LIMIT: ${DEEPSEEK_DAILY_ALERT_LIMIT:-500}
      STATUS_DIR: /db/status
      WEEKLY_MAX_PAGES: ${WEEKLY_MAX_PAGES:-3}
      WEEKLY_MAX_NEW: ${WEEKLY_MAX_NEW:-20}
      WEEKLY_MAX_AGE: ${WEEKLY_MAX_AGE:-30}
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:31473/api/queue || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
